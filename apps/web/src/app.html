<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<script>
			// Pre-paint theme resolution: cookie wins (server already rendered accordingly),
			// otherwise fall back to system preference and persist it as the cookie for next time.
			(function () {
				var match = document.cookie.match(/(?:^|;\s*)theme=(dark|light)/);
				var theme = match
					? match[1]
					: matchMedia('(prefers-color-scheme: dark)').matches
						? 'dark'
						: 'light';
				if (theme === 'dark') document.documentElement.classList.add('dark');
				if (!match) document.cookie = 'theme=' + theme + ';path=/;max-age=31536000;SameSite=Lax';
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
