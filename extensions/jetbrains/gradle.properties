pluginGroup = com.github.krowten.sourcebeam
pluginName = Sourcebeam
pluginVersion = 0.1.2

# The oldest platform the plugin is built and verified against. 243 = 2024.3; the plugin only
# uses APIs available there, so untilBuild is left open in build.gradle.kts.
pluginSinceBuild = 243

# IC (Community) hasn't been published as a separate distribution since 2025.3 — IntelliJ IDEA
# is now a single unified edition (still the IU product code under the hood).
platformType = IU
platformVersion = 2026.1.4

gradleVersion = 9.7.1

org.gradle.caching = true
org.gradle.configuration-cache = true
kotlin.stdlib.default.dependency = false
